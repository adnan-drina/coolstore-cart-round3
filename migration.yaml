# Migration provenance record — stamped by the app-migration template.
# The legacy application is intentionally NOT registered in the catalog;
# this file is the durable record of where the migration started.
migration:
  legacyRepoUrl: https://github.com/adnan-drina/coolstore-cart-legacy.git
  target: quarkus
  legacyPackage: com.redhat.coolstore
  targetPackage: com.demo
  provisionedBy: app-migration golden-path template
acceptance:
  # The harness supervisor asserts this after deploy (Phase E success).
  path: /api/cart/acceptance-check
  needsDatabase: false
analysis:
  # MTA rule selection is LABEL FILTERING (--source/--target pick only
  # matching rules; everything else is silently excluded). The decided
  # set for this platform: the migration path itself, cloud-readiness
  # (we deploy to OpenShift), and the JDK jump. Applies to the IDE
  # analysis AND the supervisor's kantra fallback.
  targets: [quarkus, jakarta-ee9, cloud-readiness, openjdk17]
targetContract:
  # Decided modern contract for REDESIGN classes (M1 §7 authoritative).
  getIdempotent: true
  validateInput: true
  mapErrors: true
  threadSafeState: true
  cacheRefreshGuard: true
  normalizeBeforeDerive: true
preserve:
  # Enforced: plan-lint maps each item to a task; the preflight sensor
  # greps them in src/main|pom|k8s. Erasing one is a functional
  # regression no unit test catches (run #1 lesson).
  - CATALOG_ENDPOINT
forbidden:
  # Fabrication tripwires (run #2 T-027): sensors fail any commit that
  # introduces these into src/main.
  - getMockProducts
  - "mock products"
  - "Mock products"
  - "mock Products"
  - "Fallback to mock"
