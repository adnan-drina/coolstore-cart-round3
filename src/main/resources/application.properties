# Quarkus application configuration
# Catalog products endpoint used by the REST CatalogService.
# Override with env CATALOG_ENDPOINT or -DCATALOG_ENDPOINT=...
CATALOG_ENDPOINT=http://localhost:8081

# Quarkus REST Client configuration for CatalogService
# Base URL for the catalog service (can be overridden with CATALOG_ENDPOINT env var)
quarkus.rest-client."com.demo.service.CatalogService".url=${CATALOG_ENDPOINT}

# Quarkus HTTP configuration
quarkus.http.cors.origins=*
